name: Relock (temporary)

# Regenerates uv.lock against stackone-ai 3.0.0 on PyPI, which a local index proxy does not serve
# yet. Removed in the commit that takes its output.
on:
  pull_request:

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv lock --upgrade-package stackone-ai
      - run: uv sync --extra dev --locked && uv run pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
