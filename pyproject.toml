[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackone-adk"
version = "0.2.0"
description = "StackOne plugin for Google ADK: Connect agents to 200+ SaaS providers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "StackOne", email = "support@stackone.com"},
]
keywords = ["adk", "stackone", "saas", "plugin", "google-adk", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "google-adk>=1.31.1",
    "stackone-ai[mcp]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/StackOneHQ/stackone-adk-plugin"
Repository = "https://github.com/StackOneHQ/stackone-adk-plugin"
Documentation = "https://github.com/StackOneHQ/stackone-adk-plugin#readme"

[tool.hatch.build.targets.wheel]
packages = ["stackone_adk"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

# python_version is deliberately unset so mypy targets the running interpreter.
# Pinning it to 3.10 made mypy parse dependency stubs with 3.10 grammar while the
# environment could hold 3.12-only packages (numpy >=2.5 uses `type` statements),
# which fails on a syntax error. The CI matrix covers 3.10-3.13 instead.
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
